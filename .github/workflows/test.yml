# Tests against a real database: Oracle Database Free 23ai in a service
# container (https://hub.docker.com/r/gvenzl/oracle-free). The slim image has
# no MLE (JavaScript) or Spatial, so nothing here tests those.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "30.1", snapshot]   # 29.1: the minimum in Package-Requires
    continue-on-error: ${{ matrix.emacs == 'snapshot' }}
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: ci_only_system_pw
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ORAJS_USER: ORAJS_CI
      ORAJS_SERVICE: localhost:1521/FREEPDB1
      ORAJS_PASSWORD_FILE: ${{ github.workspace }}/../orajs_ci.pw
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Universal Ctags (for orajs-make-tags-with-universal-ctags)
        run: sudo apt-get update && sudo apt-get install -y universal-ctags
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Create the test user (as SYSTEM)
        run: |
          echo 'Orajs_ci_1' > "$ORAJS_PASSWORD_FILE"
          docker exec -i ${{ job.services.oracle.id }} \
            sqlplus -s -L system/ci_only_system_pw@//localhost/FREEPDB1 <<'SQL'
          whenever sqlerror exit failure
          create user orajs_ci identified by "Orajs_ci_1";
          grant dba, db_developer_role to orajs_ci;
          exit
          SQL

      - name: Bridge protocol (node-oracledb against the database)
        run: node test/bridge-test.js
      - name: ERT (unit tests, plus orajs-live-* against the database)
        if: success() || failure()   # run even when the bridge test failed
        run: emacs --batch -Q -L . -l test/orajs-test.el -f ert-run-tests-batch-and-exit
